<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0810" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>深渊回响 · ABYSS ECHO</title>
  <style>
/* 深渊回响 ABYSS ECHO · H5 v2（开心消消乐式滑动消除） */

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
  background: #06040a;
  color: #E8DFC8;
  font-family: "Sarasa Gothic SC", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

body { display: flex; justify-content: center; }

#app {
  position: relative;
  width: 100%;
  max-width: 430px;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at 50% 0%, #171029 0%, #0A0810 62%);
  display: flex;
  flex-direction: column;
}

.screen { display: none; width: 100%; height: 100%; min-height: 0; }
.screen.active { display: flex; flex-direction: column; align-items: center; }
.screen.active.battle { align-items: stretch; }

/* ============ 标题页 ============ */
.title-page {
  justify-content: center;
  padding: 40px 24px;
  background: radial-gradient(circle at 50% 30%, #1b1230 0%, #0A0810 70%);
  overflow: hidden;
}
.title-glow {
  position: absolute; top: 14%; width: 300px; height: 300px; border-radius: 50%;
  background: radial-gradient(circle, rgba(122, 79, 184, 0.42) 0%, rgba(10, 8, 16, 0) 70%);
  filter: blur(10px);
  animation: breathe 5s ease-in-out infinite;
}
@keyframes breathe { 0%,100% { opacity: .55; transform: scale(.95); } 50% { opacity: 1; transform: scale(1.08); } }
.title-block { display: flex; flex-direction: column; align-items: center; z-index: 2; }
.eyebrow { color: #9A7BC0; font-size: 11px; letter-spacing: 2px; margin-bottom: 14px; }
.game-title { color: #E8DFC8; font-size: 48px; font-weight: 700; letter-spacing: 4px; text-shadow: 0 0 18px rgba(122, 79, 184, 0.65); }
.game-en { color: #6E5A8C; font-size: 17px; letter-spacing: 6px; margin-top: 6px; }
.game-tag { color: #8A8098; font-size: 13px; margin-top: 20px; text-align: center; line-height: 1.6; }
.enter-btn {
  margin-top: 44px; width: 210px; height: 50px; border-radius: 25px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #4a2f7a, #2a1848);
  border: 1px solid #7a4fb8;
  box-shadow: 0 0 18px rgba(122, 79, 184, 0.6);
  cursor: pointer; z-index: 2; user-select: none;
  animation: btnPulse 2.4s ease-in-out infinite;
}
@keyframes btnPulse { 0%,100% { box-shadow: 0 0 14px rgba(122,79,184,.45); } 50% { box-shadow: 0 0 26px rgba(160,110,230,.8); } }
.enter-text { color: #F2EAD8; font-size: 17px; font-weight: 600; letter-spacing: 3px; }
.enter-btn:active { transform: scale(0.97); }
.hint { margin-top: 30px; color: #5A5068; font-size: 11px; text-align: center; line-height: 1.7; z-index: 2; }

/* ============ 战斗页 ============ */
.battle-inner {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  padding: 8px 14px 10px;
  gap: 8px;
}

.boss-panel {
  position: relative;
  flex: 0 0 auto;
  padding: 8px 11px 9px;
  border-radius: 12px;
  background: linear-gradient(180deg, rgba(34, 22, 52, .92), rgba(18, 12, 30, .92));
  border: 1px solid #33234f;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .06);
}
.boss-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.boss-name { color: #EFE6D2; font-size: 13.5px; font-weight: 600; letter-spacing: .3px; transition: color .15s, text-shadow .15s; }
.boss-name.hit { color: #FF9E8C; text-shadow: 0 0 12px rgba(255, 90, 60, .9); }
.phase-tag { flex: 0 0 auto; color: #F0A89A; font-size: 10px; padding: 2px 7px; border-radius: 10px; background: rgba(178, 64, 46, .22); border: 1px solid #b8402e; }
.hp-bar { position: relative; margin-top: 7px; height: 14px; border-radius: 7px; background: rgba(0, 0, 0, .55); border: 1px solid #46283a; overflow: hidden; }
.hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #8f2c20, #e0584a 70%, #ff8a72); transition: width .38s cubic-bezier(.2,.8,.3,1); box-shadow: 0 0 10px rgba(224, 88, 74, .55); }
.hp-label { position: absolute; inset: 0; text-align: center; color: #FBEDE6; font-size: 9.5px; line-height: 13px; letter-spacing: .5px; text-shadow: 0 1px 2px rgba(0,0,0,.9); }
.telegraph { margin-top: 5px; color: #C97A6A; font-size: 10.5px; letter-spacing: .2px; }

.hud { flex: 0 0 auto; display: flex; gap: 8px; }
.stat { flex: 1; padding: 6px 9px 7px; border-radius: 10px; background: rgba(20, 16, 32, .72); border: 1px solid #241a38; }
.stat-label { color: #8A8098; font-size: 9.5px; letter-spacing: .6px; }
.mini-bar { margin: 4px 0; height: 7px; border-radius: 4px; background: rgba(0, 0, 0, .55); overflow: hidden; }
.mini-fill { height: 100%; width: 100%; transition: width .3s ease; }
.mini-fill.life { background: linear-gradient(90deg, #b8402e, #e0584a); }
.mini-fill.sanity { background: linear-gradient(90deg, #5a3590, #a97be0); }
.stat-val { color: #E8DFC8; font-size: 12px; font-weight: 700; }

/* ---- 棋盘 ---- */
.board-wrap {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 900px;
}
.board-wrap.shake-soft { animation: shakeSoft .32s ease-in-out; }
.board-wrap.shake-hard { animation: shakeHard .42s ease-in-out; }
@keyframes shakeSoft { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@keyframes shakeHard {
  0%,100% { transform: translate(0,0) rotate(0); }
  15% { transform: translate(-7px,3px) rotate(-.7deg); }
  35% { transform: translate(7px,-3px) rotate(.7deg); }
  55% { transform: translate(-5px,2px) rotate(-.4deg); }
  78% { transform: translate(4px,-1px) rotate(.3deg); }
}

.board {
  position: relative;
  border-radius: 16px;
  background:
    radial-gradient(circle at 50% 0%, rgba(110, 70, 180, .16), rgba(0, 0, 0, 0) 62%),
    rgba(11, 8, 19, .82);
  border: 1px solid #2a1e42;
  box-shadow: 0 12px 34px rgba(0, 0, 0, .55), inset 0 0 44px rgba(90, 53, 144, .16);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  isolation: isolate;
}

.board-grid {
  position: absolute; inset: 0;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  z-index: 0;
}
.board-grid i { margin: 2px; border-radius: 9px; background: rgba(255, 255, 255, .028); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .025); }
.board-grid i.alt { background: rgba(255, 255, 255, .012); }

.tile-layer { position: absolute; inset: 0; z-index: 2; }

.tile {
  position: absolute; top: 0; left: 0;
  width: 12.5%; height: 12.5%;
  padding: 2.5px;
  will-change: transform;
  cursor: grab;
  transition: transform .17s cubic-bezier(.2,.9,.3,1.18);
}
.tile.dragging { cursor: grabbing; z-index: 40 !important; }
.tile.dragging .tile-inner { transform: scale(1.12); box-shadow: 0 0 0 2px rgba(232, 223, 200, .55), 0 8px 18px rgba(0, 0, 0, .6), inset 0 2px 0 rgba(255, 255, 255, .3); }

.tile-inner {
  position: relative;
  width: 100%; height: 100%;
  border-radius: 26%;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(circle at 34% 24%, rgba(255, 255, 255, .18), rgba(255, 255, 255, 0) 58%),
    linear-gradient(155deg, var(--tint, rgba(255,255,255,.2)) 0%, rgba(12, 9, 20, .92) 82%);
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, .18),
    inset 0 -3px 7px rgba(0, 0, 0, .55),
    0 3px 7px rgba(0, 0, 0, .38);
  transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease;
  overflow: hidden;
}
.tile-inner::after {
  content: "";
  position: absolute; inset: 0;
  border-radius: inherit;
  background: linear-gradient(180deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, 0) 45%);
  pointer-events: none;
}
.tile img {
  width: 76%; height: 76%;
  object-fit: contain;
  pointer-events: none;
  user-select: none;
  filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .55));
  transition: filter .2s ease;
}
.tile .badge {
  position: absolute; top: 0; right: 2px;
  font-size: 10px; line-height: 1;
  color: #FFE3A8;
  text-shadow: 0 0 6px rgba(255, 200, 90, .9);
  opacity: 0;
  transform: scale(.6);
  transition: opacity .2s, transform .2s;
}
.tile.sp-line .badge, .tile.sp-bomb .badge { opacity: 1; transform: scale(1); }

.tile.sp-line .tile-inner {
  box-shadow: 0 0 0 2px rgba(255, 214, 130, .85), 0 0 16px rgba(255, 190, 90, .55),
    inset 0 2px 0 rgba(255, 255, 255, .2), inset 0 -3px 7px rgba(0, 0, 0, .5);
}
.tile.sp-bomb .tile-inner {
  box-shadow: 0 0 0 2px rgba(255, 140, 120, .9), 0 0 18px rgba(255, 90, 60, .6),
    inset 0 2px 0 rgba(255, 255, 255, .2), inset 0 -3px 7px rgba(0, 0, 0, .5);
  animation: bombPulse 1.6s ease-in-out infinite;
}
@keyframes bombPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.28); } }

.tile.sel .tile-inner {
  transform: scale(1.06);
  box-shadow: 0 0 0 2px #F3EAD6, 0 0 18px var(--glow, #C9B6F0), inset 0 2px 0 rgba(255,255,255,.25);
}
.tile.target .tile-inner { transform: scale(.9); box-shadow: 0 0 0 2px rgba(200, 180, 255, .55), 0 0 16px rgba(160, 120, 230, .45); }

.tile.pop { z-index: 12; pointer-events: none; }
.tile.pop .tile-inner { animation: tilePop .24s cubic-bezier(.3,.1,.6,1) forwards; }
@keyframes tilePop {
  0% { transform: scale(1) rotate(0); filter: brightness(1); }
  36% { transform: scale(1.24) rotate(4deg); filter: brightness(2.4); }
  100% { transform: scale(0) rotate(-24deg); opacity: 0; filter: brightness(2); }
}

.tile .tile-inner.land { animation: landSquash .22s ease-out; }
@keyframes landSquash {
  0% { transform: scale(1, 1); }
  35% { transform: scale(1.12, .82); }
  70% { transform: scale(.95, 1.06); }
  100% { transform: scale(1, 1); }
}

.tile.nope .tile-inner { animation: nopeShake .26s ease-in-out; }
@keyframes nopeShake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-10%) rotate(-3deg); }
  70% { transform: translateX(10%) rotate(3deg); }
}

.tile.born .tile-inner { animation: bornFlash .5s ease-out; }
@keyframes bornFlash {
  0% { transform: scale(.4) rotate(-40deg); filter: brightness(2.6); }
  60% { transform: scale(1.14) rotate(6deg); filter: brightness(1.6); }
  100% { transform: scale(1) rotate(0); filter: brightness(1); }
}

.fx-layer { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
.spark { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); }
.score-pop {
  position: absolute;
  transform: translate(-50%, -50%);
  font-size: 15px; font-weight: 800; letter-spacing: .5px;
  color: #FFE3A8;
  text-shadow: 0 0 10px rgba(255, 190, 90, .8), 0 2px 4px rgba(0, 0, 0, .9);
  white-space: nowrap; pointer-events: none;
}
.score-pop.dmg { color: #FF9E8C; text-shadow: 0 0 10px rgba(255, 90, 60, .85), 0 2px 4px rgba(0,0,0,.9); }
.score-pop.gain { color: #C7F0A8; text-shadow: 0 0 10px rgba(140, 220, 100, .8), 0 2px 4px rgba(0,0,0,.9); }
.score-pop.danger { color: #FF7A66; font-size: 17px; text-shadow: 0 0 14px rgba(255, 60, 40, .95), 0 2px 6px #000; }

.combo-layer { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
.combo-banner {
  position: absolute; left: 50%; top: 44%;
  display: flex; align-items: baseline; gap: 6px;
  transform: translate(-50%, -50%);
  white-space: nowrap;
  filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .8));
}
.combo-word {
  font-size: 30px; font-weight: 800; letter-spacing: 2px;
  background: linear-gradient(180deg, #FFF6DA, #F0C97A 55%, #C98B3A);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-text-stroke: .6px rgba(60, 30, 0, .35);
}
.combo-num {
  font-size: 22px; font-weight: 800; color: #FFE3A8;
  text-shadow: 0 0 14px rgba(255, 190, 90, .9);
}

.tipbar {
  flex: 0 0 auto; text-align: center;
  color: #6A5F7C; font-size: 10.5px; letter-spacing: .8px;
  user-select: none;
}

/* ---- 武器 / 底栏 ---- */
.weapon { flex: 0 0 auto; }
.weapon-bar { height: 7px; border-radius: 4px; background: rgba(0, 0, 0, .55); border: 1px solid #2c2046; overflow: hidden; }
.weapon-fill { height: 100%; width: 0; background: linear-gradient(90deg, #4a2f7a, #C9B6F0); transition: width .3s ease; }
.weapon-btn {
  margin-top: 6px; width: 100%; height: 40px; border-radius: 10px;
  color: #8A8098; background: rgba(28, 20, 44, .85); border: 1px solid #2c2046;
  font-size: 13.5px; font-family: inherit; letter-spacing: .5px;
  cursor: pointer; transition: all .2s;
}
.weapon-btn.ready {
  color: #FBF3E0;
  background: linear-gradient(135deg, #6a3fa8, #2a1848);
  border: 1px solid #a97be0;
  box-shadow: 0 0 16px rgba(150, 100, 220, .7);
  animation: btnPulse 1.8s ease-in-out infinite;
}
.weapon-btn:active { transform: scale(.99); }

.footer { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding-top: 2px; }
.turn { color: #6E5A8C; font-size: 10.5px; }
.score { color: #C9B6F0; font-size: 11px; font-weight: 600; margin-left: auto; }
.pause-btn {
  width: 62px; height: 28px; border-radius: 8px; color: #C9B6F0;
  background: rgba(28, 20, 44, .85); border: 1px solid #4a2f7a;
  font-size: 12px; font-family: inherit; cursor: pointer;
}
.pause-btn:active { transform: scale(.97); }

/* ---- 暂停 ---- */
.overlay {
  position: absolute; inset: 0; z-index: 50;
  display: flex; align-items: center; justify-content: center;
  background: rgba(8, 6, 14, .82);
  backdrop-filter: blur(3px);
}
.overlay[hidden] { display: none; }
.overlay-panel {
  width: 280px; padding: 22px 20px; border-radius: 16px;
  background: linear-gradient(180deg, rgba(36, 24, 56, .98), rgba(18, 12, 30, .98));
  border: 1px solid #4a2f7a;
  display: flex; flex-direction: column; align-items: center;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .7);
}
.overlay-title { color: #E8DFC8; font-size: 24px; font-weight: 700; letter-spacing: 2px; }
.overlay-sub { color: #9A7BC0; font-size: 10.5px; letter-spacing: 2px; margin-top: 6px; margin-bottom: 16px; }
.ov-btn {
  width: 100%; height: 42px; border-radius: 10px; margin-top: 9px;
  color: #C9B6F0; background: rgba(20, 16, 32, .85); border: 1px solid #4a2f7a;
  font-size: 14px; font-family: inherit; cursor: pointer;
}
.ov-btn.primary { color: #F2EAD8; background: linear-gradient(135deg, #4a2f7a, #2a1848); border: 1px solid #7a4fb8; }
.ov-btn.danger { color: #F0A89A; background: rgba(178, 64, 46, .2); border: 1px solid #b8402e; }
.ov-btn:active { transform: scale(.98); }

/* ============ 结算页 ============ */
.settle {
  padding: 30px 20px 22px;
  background: radial-gradient(circle at 50% 12%, #160f28 0%, #0A0810 70%);
  align-items: center;
  overflow-y: auto;
}
.result-block { display: flex; flex-direction: column; align-items: center; margin-bottom: 16px; }
.result-icon {
  width: 66px; height: 66px; border-radius: 33px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(28, 20, 44, .85); border: 1px solid #7a4fb8;
  box-shadow: 0 0 22px rgba(122, 79, 184, .55);
}
.result-glyph { font-size: 32px; color: #C9B6F0; }
.settle.lose .result-glyph { color: #b8402e; }
.result-title { margin-top: 12px; color: #E8DFC8; font-size: 26px; font-weight: 700; }
.result-en { margin-top: 4px; color: #9A7BC0; font-size: 11px; letter-spacing: 3px; }
.result-desc { margin-top: 8px; color: #8A8098; font-size: 12.5px; text-align: center; }

.score-row { width: 100%; display: flex; gap: 10px; margin-bottom: 12px; }
.grade-card {
  width: 110px; border-radius: 12px; padding: 11px 0;
  display: flex; flex-direction: column; align-items: center;
  background: linear-gradient(135deg, #4a2f7a, #2a1848); border: 1px solid #7a4fb8;
  box-shadow: 0 0 14px rgba(122, 79, 184, .5);
}
.grade-label { color: #C9B6F0; font-size: 11px; }
.grade-val { color: #F2EAD8; font-size: 44px; font-weight: 700; line-height: 1.1; }
.grade-stars { color: #F0C97A; font-size: 12px; }
.stats-stack {
  flex: 1; display: flex; flex-direction: column; justify-content: space-between;
  padding: 8px 11px; border-radius: 12px; background: rgba(20, 16, 32, .7); border: 1px solid #241a38;
}
.stat-line { display: flex; align-items: center; justify-content: space-between; }
.sl { color: #8A8098; font-size: 11.5px; }
.sv { color: #E8DFC8; font-size: 13.5px; font-weight: 600; }

.gene-card {
  width: 100%; display: flex; align-items: center; padding: 10px 12px;
  border-radius: 10px; background: rgba(20, 16, 32, .7); border: 1px solid #241a38; margin-bottom: 12px;
}
.gene-icon {
  width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  color: #8FE0C8; font-size: 20px; background: rgba(70, 143, 110, .18);
}
.gene-text { flex: 1; display: flex; flex-direction: column; margin-left: 10px; }
.gene-t { color: #E8DFC8; font-size: 14px; font-weight: 600; }
.gene-d { color: #8A8098; font-size: 10px; margin-top: 2px; }
.gene-val { color: #8FE0C8; font-size: 26px; font-weight: 700; }

.loot-section { width: 100%; margin-bottom: 12px; }
.loot-title { color: #9A7BC0; font-size: 13px; letter-spacing: 1px; font-weight: 600; }
.loot-card { display: flex; align-items: center; padding: 9px 11px; border-radius: 8px; background: rgba(20, 16, 32, .7); margin-top: 8px; }
.loot-card.legend { border: 1px solid #E0B05A; }
.loot-card.epic { border: 1px solid #9A7BC0; }
.loot-card.fine { border: 1px solid #6FB4BD; }
.loot-icon { color: #C9B6F0; font-size: 20px; width: 28px; text-align: center; }
.loot-text { flex: 1; display: flex; flex-direction: column; margin-left: 8px; }
.loot-name { color: #E8DFC8; font-size: 13.5px; font-weight: 600; }
.loot-desc { color: #8A8098; font-size: 10px; margin-top: 2px; }
.loot-tag { font-size: 10px; font-weight: 600; }
.loot-card.legend .loot-tag { color: #E0B05A; }
.loot-card.epic .loot-tag { color: #9A7BC0; }
.loot-card.fine .loot-tag { color: #6FB4BD; }

.bottom-btns { width: 100%; margin-top: auto; padding-top: 6px; }
.btn-primary {
  width: 100%; height: 48px; border-radius: 12px; color: #F2EAD8;
  background: linear-gradient(135deg, #6a3fa8, #2a1848); border: 1px solid #a97be0;
  box-shadow: 0 0 16px rgba(122, 79, 184, .55); font-size: 15px; font-family: inherit; cursor: pointer;
}
.btn-ghost {
  width: 100%; height: 44px; border-radius: 12px; margin-top: 9px; color: #C9B6F0;
  background: rgba(20, 16, 32, .85); border: 1px solid #4a2f7a; font-size: 14px; font-family: inherit; cursor: pointer;
}
.btn-primary:active, .btn-ghost:active { transform: scale(.98); }

/* ============ 标题页 · 祭坛入口 ============ */
.altar-btn {
  margin-top: 14px; width: 210px; height: 44px; border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(28, 20, 44, .6); border: 1px solid #4a2f7a;
  color: #C9B6F0; cursor: pointer; z-index: 2; user-select: none;
}
.altar-text { font-size: 15px; letter-spacing: 4px; }
.altar-btn:active { transform: scale(.97); }

/* ============ 商店页 · 亵渎祭坛 ============ */
.shop {
  padding: 26px 18px 18px;
  background: radial-gradient(circle at 50% 12%, #160f28 0%, #0A0810 72%);
  align-items: center; overflow-y: auto;
}
.shop-inner { width: 100%; max-width: 380px; display: flex; flex-direction: column; }
.shop-head { display: flex; flex-direction: column; align-items: center; margin-bottom: 18px; }
.shop-title { color: #E8DFC8; font-size: 30px; font-weight: 700; letter-spacing: 4px; text-shadow: 0 0 16px rgba(122, 79, 184, .6); }
.shop-en-title { color: #6E5A8C; font-size: 11px; letter-spacing: 5px; margin-top: 4px; }

.essence-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; border-radius: 12px; margin-bottom: 14px;
  background: linear-gradient(180deg, rgba(34, 22, 52, .92), rgba(18, 12, 30, .92));
  border: 1px solid #33234f; box-shadow: 0 4px 16px rgba(0, 0, 0, .4);
}
.essence-icon {
  width: 26px; height: 26px; border-radius: 50%; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 40% 35%, #b98be0, #5a3590); color: #fff;
  font-size: 14px; box-shadow: 0 0 10px rgba(150, 100, 220, .6);
}
.essence-label { color: #9A7BC0; font-size: 12px; letter-spacing: 1px; }
.essence-val { margin-left: auto; color: #C9B6F0; font-size: 20px; font-weight: 700; }

.shop-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.shop-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px; border-radius: 12px;
  background: rgba(20, 16, 32, .72); border: 1px solid #241a38;
  transition: opacity .2s, filter .2s;
}
.shop-item.dim { opacity: .5; }
.shop-item.owned-row { border-color: #4a2f7a; }
.shop-icon {
  width: 44px; height: 44px; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  background: rgba(12, 9, 20, .7); border-radius: 12px; border: 1px solid #2a1e42;
}
.shop-icon img { width: 34px; height: 34px; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .6)); }
.shop-info { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.shop-name { color: #E8DFC8; font-size: 15px; font-weight: 600; display: flex; align-items: baseline; gap: 7px; }
.shop-en { color: #6E5A8C; font-size: 9px; letter-spacing: 2px; }
.shop-desc { color: #8A8098; font-size: 11px; margin-top: 3px; }
.shop-buy {
  flex: 0 0 auto; min-width: 52px; height: 40px; padding: 0 12px; border-radius: 10px;
  color: #F2EAD8; font-size: 15px; font-weight: 700; font-family: inherit;
  background: linear-gradient(135deg, #4a2f7a, #2a1848); border: 1px solid #7a4fb8; cursor: pointer;
}
.shop-buy:active { transform: scale(.96); }
.shop-buy.sold, .shop-buy.owned { color: #6E5A8C; background: rgba(28, 20, 44, .6); border-color: #2c2046; }
.shop-buy[disabled] { cursor: default; opacity: .85; }
.leave-btn {
  width: 100%; height: 46px; border-radius: 12px; margin-top: 4px; color: #C9B6F0;
  background: rgba(20, 16, 32, .85); border: 1px solid #4a2f7a; font-size: 14px; font-family: inherit; cursor: pointer;
}
.leave-btn:active { transform: scale(.98); }
.shop-foot { margin-top: 12px; text-align: center; color: #5A5068; font-size: 10.5px; letter-spacing: .5px; }

@media (max-height: 700px) {
  .boss-panel { padding: 6px 10px; }
  .telegraph { display: none; }
  .weapon-btn { height: 36px; }
  .tipbar { display: none; }
  .hud .stat { padding: 4px 8px 5px; }
}

/* 桌面端：把游戏框成一块手机屏 */
@media (min-width: 470px) {
  body { align-items: center; background: radial-gradient(circle at 50% 30%, #100b1c 0%, #050308 70%); }
  #app {
    height: min(880px, 100vh);
    border-radius: 26px;
    border: 1px solid #2a1e42;
    box-shadow: 0 28px 90px rgba(0, 0, 0, .8), 0 0 0 7px rgba(18, 12, 30, .75);
  }
}


/* ===== 祭坛商店（H5） ===== */
.altar-btn { justify-content: space-between; padding: 0 34px; box-sizing: border-box; }
.altar-essence { color: #C9B6F0; font-size: 13px; font-weight: 600; }

.shop { padding: 18px 16px 28px; align-items: center; overflow-y: auto; }
.shop-inner { width: 100%; max-width: 430px; display: flex; flex-direction: column; }
.shop-head { display: flex; flex-direction: column; align-items: center; margin-bottom: 14px; }
.shop-title { color: #E8DFC8; font-size: 28px; font-weight: 700; letter-spacing: 4px; text-shadow: 0 0 16px rgba(122,79,184,.6); }
.shop-en-title { color: #6E5A8C; font-size: 10px; letter-spacing: 5px; margin-top: 3px; }

.shop .essence-bar { margin-bottom: 10px; }
.shop .essence-val { font-size: 20px; }
.shop .essence-icon { font-size: 13px; }

.daily-card {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 11px; margin-bottom: 11px;
  background: linear-gradient(135deg, rgba(90,60,140,.55), rgba(30,20,48,.9));
  border: 1px solid #7a4fb8; box-shadow: 0 0 12px rgba(122,79,184,.35);
  cursor: pointer;
}
.daily-card.done { opacity: .55; border-color: #2c2046; box-shadow: none; }
.daily-icon { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: rgba(12,9,20,.55); font-size: 17px; }
.daily-text { flex: 1; display: flex; flex-direction: column; }
.daily-title { color: #F2EAD8; font-size: 13.5px; font-weight: 600; display: flex; align-items: baseline; gap: 6px; }
.daily-en { color: #9A7BC0; font-size: 8.5px; letter-spacing: 2px; }
.daily-desc { color: #B9A6D6; font-size: 10.5px; margin-top: 2px; }
.daily-btn { padding: 5px 12px; border-radius: 15px; color: #F2EAD8; font-size: 11.5px; font-weight: 600;
  background: linear-gradient(135deg, #6a3fa8, #2a1848); border: 1px solid #a97be0; }

.shop-tabs { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 9px; -webkit-overflow-scrolling: touch; }
.shop-tab { flex: 0 0 auto; padding: 5px 12px; border-radius: 15px; color: #8A8098; font-size: 11.5px;
  background: rgba(20,16,32,.7); border: 1px solid #241a38; cursor: pointer; white-space: nowrap; }
.shop-tab.active { color: #F2EAD8; background: linear-gradient(135deg, #4a2f7a, #2a1848); border-color: #7a4fb8; }

.shop .shop-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 13px; }
.shop .shop-item { padding: 10px; border-radius: 11px; background: rgba(20,16,32,.74); border: 1px solid #241a38; }
.shop .shop-icon { position: relative; width: 42px; height: 42px; border: 1px solid #2a1e42; border-radius: 11px;
  background: rgba(12,9,20,.8); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.shop-emoji { font-size: 21px; line-height: 1; }
.own-badge { position: absolute; right: -5px; top: -5px; min-width: 15px; height: 15px; line-height: 15px;
  padding: 0 4px; border-radius: 8px; text-align: center; background: #4a2f7a; color: #E8DFC8; font-size: 9px;
  border: 1px solid #7a4fb8; }
.shop .shop-name { font-size: 14px; }
.shop .shop-desc { font-size: 10.5px; margin-top: 2px; }
.buy-btn { flex: 0 0 auto; min-width: 54px; padding: 6px 9px; border-radius: 9px; text-align: center;
  color: #F2EAD8; font-size: 13px; font-weight: 700; cursor: pointer;
  background: linear-gradient(135deg, #6a3fa8, #2a1848); border: 1px solid #a97be0; }
.buy-btn:active { transform: scale(.96); }
.buy-btn.poor { color: #6E5A8C; background: rgba(28,20,44,.7); border-color: #2c2046; }

.essence-row { width: 100%; display: flex; align-items: center; justify-content: space-between;
  padding: 9px 12px; margin-bottom: 10px; border-radius: 9px; background: rgba(30,20,50,.8);
  border: 1px solid #4a2f7a; box-sizing: border-box; }
.essence-row-label { color: #B9A6D6; font-size: 12px; }
.essence-row-val { color: #C9B6F0; font-size: 15px; font-weight: 700; }

/* ===== 战斗道具栏 ===== */
.items { width: 100%; display: flex; gap: 7px; overflow-x: auto; padding: 2px 0 4px; }
.items[hidden] { display: none; }
.item-chip { position: relative; flex: 0 0 auto; width: 38px; height: 38px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  background: rgba(20,16,32,.85); border: 1px solid #3a2a58; }
.item-chip:active { transform: scale(.94); }
.item-ico { font-size: 19px; line-height: 1; }
.item-count { position: absolute; right: -4px; top: -4px; min-width: 14px; height: 14px; line-height: 14px;
  padding: 0 3px; border-radius: 7px; background: #4a2f7a; color: #E8DFC8; font-size: 8.5px; text-align: center;
  border: 1px solid #7a4fb8; }

.aim-bar { width: 100%; display: flex; align-items: center; justify-content: space-between;
  padding: 7px 10px; margin-top: 4px; border-radius: 8px; background: rgba(122,79,184,.22);
  border: 1px solid #7a4fb8; box-sizing: border-box; }
.aim-bar[hidden] { display: none; }
.aim-text { color: #E8DFC8; font-size: 11.5px; }
.aim-cancel { color: #F0A89A; font-size: 11.5px; padding-left: 8px; cursor: pointer; }

.tile.hint .tile-inner {
  box-shadow: 0 0 0 2px #FFE3A8, 0 0 18px rgba(255,200,90,.85),
    inset 0 2px 0 rgba(255,255,255,.22), inset 0 -3px 7px rgba(0,0,0,.5);
  animation: hintPulse .9s ease-in-out infinite;
}
@keyframes hintPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }

</style>
</head>

    { id: 'abyss', cat: 'gift', name: '深渊大礼包', en: 'ABYSS', icon: '📦', tint: '#E0B05A', desc: '消除道具各 ×2', long: '锤子 / 炸弹 / 彩虹 / 置换 / 重排 / 提示 各 2 个，原价 216。', price: 120, gift: { hammer: 2, bomb: 2, rainbow: 2, swap: 2, shuffle: 2, hint: 2 } },
  ];

  const BY_ID = {};
  ITEMS.forEach(function (it) { BY_ID[it.id] = it; });

  function defaultState() {
    return { crystals: 80, inv: {}, daily: '', totalBuy: 0 };
  }

  function load() {
    let s = null;
    try {
      const raw = global.localStorage.getItem(STORE_KEY);
      s = raw ? JSON.parse(raw) : null;
    } catch (e) { s = null; }
    if (!s || typeof s !== 'object') {
      s = defaultState();
      save(s);
      return s;
    }
    const d = defaultState();
    return {
      crystals: typeof s.crystals === 'number' ? s.crystals : d.crystals,
      inv: s.inv || {},
      daily: s.daily || '',
      totalBuy: s.totalBuy || 0,
    };
  }

  function save(s) {
    try { global.localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { /* noop */ }
  }

  function today() {
    const d = new Date();
    const p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function countOf(s, id) { return (s.inv && s.inv[id]) || 0; }

  function buy(id) {
    const item = BY_ID[id];
    if (!item) return { ok: false, reason: 'unknown' };
    const s = load();
    if (s.crystals < item.price) return { ok: false, reason: 'poor', state: s };
    s.crystals -= item.price;
    if (item.gift) {
      Object.keys(item.gift).forEach(function (k) { s.inv[k] = (s.inv[k] || 0) + item.gift[k]; });
    } else {
      s.inv[id] = (s.inv[id] || 0) + 1;
    }
    s.totalBuy += 1;
    save(s);
    return { ok: true, state: s };
  }

  function claimDaily() {
    const s = load();
    const t = today();
    if (s.daily === t) return { ok: false, reason: 'done', state: s };
    s.daily = t;
    s.crystals += 8;
    s.inv.hint = (s.inv.hint || 0) + 1;
    save(s);
    return { ok: true, state: s };
  }

  function gainCrystals(n) {
    const s = load();
    s.crystals = Math.max(0, s.crystals + (n || 0));
    save(s);
    return s;
  }

  function consumeBuffs() {
    const s = load();
    const active = {};
    let changed = false;
    ['blood', 'spore', 'tendril'].forEach(function (id) {
      if ((s.inv[id] || 0) > 0) { active[id] = true; s.inv[id] -= 1; changed = true; }
    });
    if (changed) save(s);
    return active;
  }

  function consume(id) {
    const s = load();
    if (!s.inv[id] || s.inv[id] <= 0) return false;
    s.inv[id] -= 1;
    save(s);
    return true;
  }

  global.AbyssShop = {
    CATS: CATS, ITEMS: ITEMS, BY_ID: BY_ID,
    load: load, save: save, today: today, countOf: countOf,
    buy: buy, claimDaily: claimDaily, gainCrystals: gainCrystals,
    consumeBuffs: consumeBuffs, consume: consume,
  };

  <script>
/*
 * board.js — 三消棋盘引擎（纯逻辑，不依赖任何渲染 / 框架）
 * 浏览器 / Node 双用（UMD）。
 *
 * v2 变更：
 *  - 每个格子带有 special 字段（null | 'line' | 'bomb'），用于「四连生成直线炸弹 / 拐角生成爆破弹」
 *  - 新增 findRuns()：返回每一段 3+ 连线的方向与格子，供消除特效与特殊宝石生成使用
 *  - 新增 makeCell / randType 导出，供前端做下落补位
 */
(function (global) {
  const TYPE_COUNT = 5; // 0红符文 1紫触手 2绿眼 3骨颅 4青孢
  let _idSeed = 0;

  function randType() {
    return Math.floor(Math.random() * TYPE_COUNT);
  }

  function makeCell(type) {
    return { id: ++_idSeed, type: type, special: null };
  }

  // 在 (r,c) 放置 t 是否会与已落子的左侧两个或上方两个形成初始三连
  function causesInitialMatch(board, row, c, t) {
    if (c >= 2 && row[c - 1] && row[c - 2] &&
        row[c - 1].type === t && row[c - 2].type === t) return true;
    const r = board.length; // 当前行号（尚未 push 进 board）
    if (r >= 2 && board[r - 1] && board[r - 2] &&
        board[r - 1][c] && board[r - 2][c] &&
        board[r - 1][c].type === t && board[r - 2][c].type === t) return true;
    return false;
  }

  function createBoard(rows, cols) {
    const b = [];
    for (let r = 0; r < rows; r++) {
      const row = [];
      for (let c = 0; c < cols; c++) {
        let t;
        let guard = 0;
        do {
          t = randType();
          guard++;
        } while (causesInitialMatch(b, row, c, t) && guard < 50);
        row.push(makeCell(t));
      }
      b.push(row);
    }
    return b;
  }

  // 返回所有 3+ 连线：[{ type, dir:'h'|'v', len, cells:[{r,c}] }]
  function findRuns(board) {
    const rows = board.length;
    const cols = board[0].length;
    const runs = [];

    // 水平
    for (let r = 0; r < rows; r++) {
      let start = 0;
      for (let c = 1; c <= cols; c++) {
        const prev = board[r][start];
        const cur = c < cols ? board[r][c] : null;
        const same = !!(prev && cur && prev.type === cur.type);
        if (!same) {
          const len = c - start;
          if (len >= 3 && prev) {
            const cells = [];
            for (let k = start; k < c; k++) cells.push({ r: r, c: k });
            runs.push({ type: prev.type, dir: 'h', len: len, cells: cells });
          }
          start = c;
        }
      }
    }
    // 垂直
    for (let c = 0; c < cols; c++) {
      let start = 0;
      for (let r = 1; r <= rows; r++) {
        const prev = board[start][c];
        const cur = r < rows ? board[r][c] : null;
        const same = !!(prev && cur && prev.type === cur.type);
        if (!same) {
          const len = r - start;
          if (len >= 3 && prev) {
            const cells = [];
            for (let k = start; k < r; k++) cells.push({ r: k, c: c });
            runs.push({ type: prev.type, dir: 'v', len: len, cells: cells });
          }
          start = r;
        }
      }
    }
    return runs;
  }

  // 找出所有处于 3+ 连线中的格子（去重），返回 [{r,c}]
  function findMatches(board) {
    const seen = Object.create(null);
    const out = [];
    const runs = findRuns(board);
    for (let i = 0; i < runs.length; i++) {
      const cells = runs[i].cells;
      for (let j = 0; j < cells.length; j++) {
        const key = cells[j].r + ',' + cells[j].c;
        if (!seen[key]) { seen[key] = 1; out.push(cells[j]); }
      }
    }
    return out;
  }

  function swapCells(board, r1, c1, r2, c2) {
    const tmp = board[r1][c1];
    board[r1][c1] = board[r2][c2];
    board[r2][c2] = tmp;
  }

  function isAdjacent(r1, c1, r2, c2) {
    return Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1;
  }

  // 重力下落 + 顶部补充（直接修改 board）
  function collapseAndRefill(board) {
    const rows = board.length;
    const cols = board[0].length;
    for (let c = 0; c < cols; c++) {
      let writeRow = rows - 1;
      for (let r = rows - 1; r >= 0; r--) {
        if (board[r][c]) {
          if (writeRow !== r) {
            board[writeRow][c] = board[r][c];
            board[r][c] = null;
          }
          writeRow--;
        }
      }
      for (let r = writeRow; r >= 0; r--) board[r][c] = makeCell(randType());
    }
  }

  // 完整级联（无动画版本，Node 测试 / 小程序结算用）
  function resolve(board) {
    let cascades = 0;
    let totalCleared = 0;
    const dmgByType = [0, 0, 0, 0, 0];
    while (true) {
      const matches = findMatches(board);
      if (matches.length === 0) break;
      cascades++;
      for (const m of matches) {
        dmgByType[board[m.r][m.c].type]++;
        totalCleared++;
      }
      for (const m of matches) board[m.r][m.c] = null;
      collapseAndRefill(board);
    }
    return { cascades, totalCleared, dmgByType };
  }

  function clearAndCollapse(board, matches) {
    const dmgByType = [0, 0, 0, 0, 0];
    for (const m of matches) {
      dmgByType[board[m.r][m.c].type]++;
      board[m.r][m.c] = null;
    }
    collapseAndRefill(board);
    return { dmgByType, totalCleared: matches.length };
  }

  // 死局检测：是否还存在可消除的走法
  function hasPossibleMove(board) {
    const rows = board.length;
    const cols = board[0].length;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (c + 1 < cols) {
          swapCells(board, r, c, r, c + 1);
          const ok = findMatches(board).length > 0;
          swapCells(board, r, c, r, c + 1);
          if (ok) return true;
        }
        if (r + 1 < rows) {
          swapCells(board, r, c, r + 1, c);
          const ok = findMatches(board).length > 0;
          swapCells(board, r, c, r + 1, c);
          if (ok) return true;
        }
      }
    }
    return false;
  }

  // 洗牌：保证无初始连线且至少存在一步可走
  function shuffleBoard(board) {
    const rows = board.length;
    const cols = board[0].length;

    function assign(fill) {
      let k = 0;
      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++) {
          if (!board[r][c]) board[r][c] = makeCell(fill[k]);
          else { board[r][c].type = fill[k]; board[r][c].special = null; }
          k++;
        }
    }

    function good() {
      return findMatches(board).length === 0 && hasPossibleMove(board);
    }

    // 先做「同色多重集内的排列」，做不出合法局面再退化为完全随机
    for (let attempt = 0; attempt < 240; attempt++) {
      const flat = [];
      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++) flat.push(board[r][c] ? board[r][c].type : randType());
      for (let i = flat.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = flat[i]; flat[i] = flat[j]; flat[j] = t;
      }
      assign(flat);
      if (good()) return true;
    }
    for (let attempt = 0; attempt < 200; attempt++) {
      const flat = [];
      for (let i = 0; i < rows * cols; i++) flat.push(randType());
      assign(flat);
      if (good()) return true;
    }
    return false;
  }

  const api = {
    TYPE_COUNT,
    randType,
    makeCell,
    createBoard,
    findRuns,
    findMatches,
    swapCells,
    isAdjacent,
    resolve,
    clearAndCollapse,
    hasPossibleMove,
    shuffleBoard,
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  if (global) global.BoardLib = api;
})(typeof window !== 'undefined' ? window : this);

      board: screenBattle.querySelector('.board'),
      gridLayer: screenBattle.querySelector('.board-grid'),
      tileLayer: screenBattle.querySelector('.tile-layer'),
      fxLayer: screenBattle.querySelector('.fx-layer'),
      comboLayer: screenBattle.querySelector('.combo-layer'),
      turn: screenBattle.querySelector('.turn'),
      score: screenBattle.querySelector('.score'),
      weaponFill: screenBattle.querySelector('.weapon-fill'),
      weaponBtn: screenBattle.querySelector('.weapon-btn'),
      overlay: screenBattle.querySelector('.overlay'),
      itemsLayer: screenBattle.querySelector('#item-bar'),
      aimBar: screenBattle.querySelector('.aim-bar'),
      aimText: screenBattle.querySelector('.aim-text'),
    };

    // 底格
    let cellsHtml = '';
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        cellsHtml += '<i class="' + ((r + c) % 2 ? 'alt' : '') + '"></i>';
    el.gridLayer.innerHTML = cellsHtml;
  }

  /* ============================== 棋盘视图 ============================== */
  function tintOf(type) { return TYPE_META[type].tint; }

  function applyLook(t) {
    const m = TYPE_META[t.cell.type];
    t.el.style.setProperty('--tint', m.tint);
    t.el.style.setProperty('--glow', m.glow);
    t.img.src = GEM_ICONS[t.cell.type];
    const special = t.cell.special;
    t.el.classList.toggle('sp-line', special === 'line');
    t.el.classList.toggle('sp-bomb', special === 'bomb');
    t.badge.textContent = special === 'line' ? '↯' : (special === 'bomb' ? '✹' : '');
  }

  function setTransform(t, r, c, dur, ease) {
    if (dur) {
      t.el.style.transition = 'transform ' + dur + 'ms ' + (ease || EASE_SWAP);
    } else {
      t.el.style.transition = 'none';
    }
    t.el.style.transform = 'translate3d(' + (c * 100) + '%,' + (r * 100) + '%,0)';
  }

  function createTile(cell, r, c, spawnRow) {
    const node = document.createElement('div');
    node.className = 'tile';
    node.dataset.id = cell.id;
    node.innerHTML = '<div class="tile-inner"><img alt="" draggable="false"><span class="badge"></span></div>';
    const t = {
      id: cell.id, cell: cell, r: r, c: c,
      el: node,
      inner: node.querySelector('.tile-inner'),
      img: node.querySelector('img'),
      badge: node.querySelector('.badge'),
    };
    S.tiles.set(cell.id, t);
    S.grid[r][c] = t;
    applyLook(t);
    setTransform(t, spawnRow == null ? r : spawnRow, c, 0);
    el.tileLayer.appendChild(node);
    return t;
  }

  function buildTiles() {
    el.tileLayer.innerHTML = '';
    S.tiles.clear();
    const pending = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = createTile(S.board[r][c], r, c, r - ROWS - 1);
        pending.push(t);
      }
    }
    // 依次落入
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        for (const t of pending) {
          const delay = (t.r + t.c) * 26;
          t.el.style.transitionDelay = delay + 'ms';
          setTransform(t, t.r, t.c, 460, EASE_FALL);
          setTimeout(function () {
            t.el.style.transitionDelay = '';
            squash(t);
          }, delay + 440);
        }
      });
    });
  }

  function squash(t) {
    if (!t.el.isConnected) return;
    t.inner.classList.remove('land');
    void t.inner.offsetWidth;
    t.inner.classList.add('land');
    setTimeout(function () { t.inner.classList.remove('land'); }, 220);
  }

  /* ============================== 特效 ============================== */
  function burst(c, r, color, power) {
    const p = power || 1;
    const n = p > 1 ? 10 : 6;
    const x = ((c + 0.5) / COLS) * 100;
    const y = ((r + 0.5) / ROWS) * 100;
    for (let i = 0; i < n; i++) {
      const s = document.createElement('i');
      s.className = 'spark';
      s.style.background = color;
      s.style.left = x + '%';
      s.style.top = y + '%';
      s.style.width = s.style.height = (3 + Math.random() * 4) + 'px';
      el.fxLayer.appendChild(s);
      const ang = Math.random() * Math.PI * 2;
      const dist = (18 + Math.random() * 44) * p;
      const dx = Math.cos(ang) * dist;
      const dy = Math.sin(ang) * dist - 8;
      const a = s.animate([
        { transform: 'translate(-50%,-50%) scale(1) rotate(0deg)', opacity: 1 },
        { transform: 'translate(calc(-50% + ' + dx + 'px),calc(-50% + ' + dy + 'px)) scale(0) rotate(' + (Math.random() * 240 - 120) + 'deg)', opacity: 0 },
      ], { duration: 360 + Math.random() * 260, easing: 'cubic-bezier(.2,.7,.3,1)' });
      a.onfinish = function () { s.remove(); };
    }
  }

  function scorePop(c, r, text, cls) {
    const d = document.createElement('div');
    d.className = 'score-pop ' + (cls || '');
    d.textContent = text;
    d.style.left = ((c + 0.5) / COLS) * 100 + '%';
    d.style.top = ((r + 0.5) / ROWS) * 100 + '%';
    el.fxLayer.appendChild(d);
    const a = d.animate([
      { transform: 'translate(-50%,-50%) scale(.6)', opacity: 0 },
      { transform: 'translate(-50%,-72%) scale(1.12)', opacity: 1, offset: 0.22 },
      { transform: 'translate(-50%,-150%) scale(1)', opacity: 0 },
    ], { duration: 780, easing: 'cubic-bezier(.2,.8,.3,1)' });
    a.onfinish = function () { d.remove(); };
  }

  function showCombo(n) {
    const words = { 2: '不错', 3: '漂亮', 4: '太棒了', 5: '不可思议' };
    const w = words[Math.min(n, 5)] || '深渊共鸣';
    const d = document.createElement('div');
    d.className = 'combo-banner';
    d.innerHTML = '<span class="combo-word">' + w + '</span><span class="combo-num">×' + n + '</span>';
    el.comboLayer.appendChild(d);
    const a = d.animate([
      { transform: 'translate(-50%,-50%) scale(.4) rotate(-6deg)', opacity: 0 },
      { transform: 'translate(-50%,-50%) scale(1.15) rotate(2deg)', opacity: 1, offset: 0.28 },
      { transform: 'translate(-50%,-50%) scale(1) rotate(0deg)', opacity: 1, offset: 0.55 },
      { transform: 'translate(-50%,-62%) scale(1.04)', opacity: 0 },
    ], { duration: 900, easing: 'cubic-bezier(.2,.8,.3,1)' });
    a.onfinish = function () { d.remove(); };
  }

  function shake(kind) {
    el.boardWrap.classList.remove('shake-soft', 'shake-hard');
    void el.boardWrap.offsetWidth;
    el.boardWrap.classList.add(kind === 'hard' ? 'shake-hard' : 'shake-soft');
    setTimeout(function () {
      el.boardWrap.classList.remove('shake-soft', 'shake-hard');
    }, 420);
  }

  function bossFlash() {
    el.bossName.classList.remove('hit');
    void el.bossName.offsetWidth;
    el.bossName.classList.add('hit');
    setTimeout(function () { el.bossName.classList.remove('hit'); }, 400);
  }

  /* ============================== HUD ============================== */
  function updateHUD() {
    const s = S;
    const hpPct = Math.max(0, s.boss.hp / s.boss.maxHp * 100);
    el.hpFill.style.width = hpPct + '%';
    el.hpLabel.textContent = 'HP ' + s.boss.hp + ' / ' + s.boss.maxHp;
    el.phase.textContent = '阶段 ' + s.boss.phase + ' / 3';
    el.telegraph.textContent = '⚠ 深渊凝视蓄力中 · ' + s.boss.attackIn + ' 回合后发动';
    el.lifeFill.style.width = Math.max(0, s.player.life / s.player.maxLife * 100) + '%';
    el.sanityFill.style.width = Math.max(0, s.player.sanity / s.player.maxSanity * 100) + '%';
    el.lifeVal.textContent = Math.round(s.player.life);
    el.sanityVal.textContent = Math.round(s.player.sanity);
    el.turn.textContent = '第 ' + s.turn + ' 回合';
    el.score.textContent = '得分 ' + s.score;
    const wpn = Math.min(100, s.weapon.charge / s.weapon.max * 100);
    el.weaponFill.style.width = wpn + '%';
    if (s.weapon.ready) {
      el.weaponBtn.disabled = false;
      el.weaponBtn.classList.add('ready');
      el.weaponBtn.textContent = '释放生物武器 · 充能完毕';
    } else {
      el.weaponBtn.disabled = true;
      el.weaponBtn.classList.remove('ready');
      el.weaponBtn.textContent = '释放生物武器（充能 ' + Math.floor(wpn) + '%）';
    }
  }

  /* ============================== 开局 ============================== */
  function newBattle(layer) {
    S.boss = { name: BOSS_NAME, hp: BOSS_MAX_HP, maxHp: BOSS_MAX_HP, phase: 1, attackIn: 3 };
    S.player = { life: 100, maxLife: 100, sanity: 100, maxSanity: 100 };
    S.weapon = { charge: 0, max: WEAPON_MAX, ready: false };
    S.turn = 1; S.combo = 0; S.maxCombo = 1; S.score = 0;
    S.busy = false; S.paused = false; S.over = false; S.selected = null; S.abandoned = false;
    S.buffs = Shop.consumeBuffs();
    S.aim = null;
    S.aimFirst = null;
    if (el.aimBar) el.aimBar.hidden = true;
    S.layer = layer || 7;

    let board = B.createBoard(ROWS, COLS);
    let guard = 0;
    while (guard++ < 30 && (B.findMatches(board).length > 0 || !B.hasPossibleMove(board))) {
      board = B.createBoard(ROWS, COLS);
    }
    S.board = board;
    S.grid = [];
    for (let r = 0; r < ROWS; r++) S.grid.push(new Array(COLS).fill(null));

    buildTiles();
    updateHUD();
    el.overlay.hidden = true;
    showScreen('battle');
    S.started = true;
    refreshItems();
    refreshAltarBalance();
    announceBuffs();
    requestAnimationFrame(fitBoard);
  }

  // 棋盘按容器可用高度 / 宽度取正方形
  function fitBoard() {
    if (!el.board || !el.boardWrap) return;
    const rect = el.boardWrap.getBoundingClientRect();
    if (rect.width < 10 || rect.height < 10) return;
    const size = Math.max(200, Math.floor(Math.min(rect.width, rect.height)));
    if (el.board.style.width === size + 'px') return;
    el.board.style.width = size + 'px';
    el.board.style.height = size + 'px';
  }

  /* ============================== 交换 ============================== */
  function swapGrid(a, b) {
    const ar = a.r, ac = a.c, br = b.r, bc = b.c;
    S.board[ar][ac] = b.cell;
    S.board[br][bc] = a.cell;
    S.grid[ar][ac] = b;
    S.grid[br][bc] = a;
    a.r = br; a.c = bc;
    b.r = ar; b.c = ac;
  }

  async function animateSwap(a, b, dur) {
    dur = dur || CELL_MS_SWAP;
    swapGrid(a, b);
    a.el.style.zIndex = 6;
    b.el.style.zIndex = 5;
    setTransform(a, a.r, a.c, dur, EASE_SWAP);
    setTransform(b, b.r, b.c, dur, EASE_SWAP);
    Sfx.swap();
    await wait(dur + 12);
    a.el.style.zIndex = '';
    b.el.style.zIndex = '';
  }

  async function attemptSwap(a, b) {
    if (S.busy || S.paused || S.over) return;
    S.busy = true;
    clearSelection();
    S.lastSwap = [{ r: a.r, c: a.c }, { r: b.r, c: b.c }];

    await animateSwap(a, b);

    if (B.findRuns(S.board).length === 0) {
      Sfx.invalid();
      a.el.classList.add('nope');
      b.el.classList.add('nope');
      await animateSwap(a, b);
      setTimeout(function () {
        a.el.classList.remove('nope');
        b.el.classList.remove('nope');
      }, 260);
      S.busy = false;
      return;
    }

    await resolveCascades();
    await finishTurn();
    S.busy = false;
  }

  /* ============================== 消除 ============================== */
  function inBounds(r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS; }

  function collectClear(runs) {
    const set = new Map();
    function add(r, c) {
      if (!inBounds(r, c)) return false;
      const k = r + ',' + c;
      if (set.has(k)) return false;
      set.set(k, { r: r, c: c });
      return true;
    }
    for (const run of runs) for (const p of run.cells) add(p.r, p.c);

    const queue = [];
    set.forEach(function (p) {
      const cell = S.board[p.r][p.c];
      if (cell && cell.special) queue.push({ r: p.r, c: p.c, kind: cell.special });
    });

    const fired = new Set();
    while (queue.length) {
      const q = queue.shift();
      const key = q.r + ',' + q.c;
      if (fired.has(key)) continue;
      fired.add(key);
      const area = [];
      if (q.kind === 'bomb') {
        const rad = (S.buffs && S.buffs.tendril) ? 2 : 1;
        for (let dr = -rad; dr <= rad; dr++)
          for (let dc = -rad; dc <= rad; dc++)
            if (inBounds(q.r + dr, q.c + dc)) area.push({ r: q.r + dr, c: q.c + dc });
      } else {
        for (let c = 0; c < COLS; c++) area.push({ r: q.r, c: c });
        for (let r = 0; r < ROWS; r++) area.push({ r: r, c: q.c });
        if (S.buffs && S.buffs.tendril) {
          if (q.r - 1 >= 0) for (let c = 0; c < COLS; c++) area.push({ r: q.r - 1, c: c });
          if (q.r + 1 < ROWS) for (let c = 0; c < COLS; c++) area.push({ r: q.r + 1, c: c });
        }
      }
      for (const p of area) {
        const isNew = add(p.r, p.c);
        if (isNew) {
          const cell = S.board[p.r][p.c];
          if (cell && cell.special) queue.push({ r: p.r, c: p.c, kind: cell.special });
        }
      }
    }
    return Array.from(set.values());
  }

  function anchorOf(run) {
    if (S.lastSwap) {
      for (const s of S.lastSwap) {
        for (const p of run.cells) if (p.r === s.r && p.c === s.c) return p;
      }
    }
    return run.cells[Math.floor(run.cells.length / 2)];
  }

  function collectSpawns(runs) {
    const spawns = [];
    const byCell = new Map();
    runs.forEach(function (run, i) {
      run.cells.forEach(function (p) {
        const k = p.r + ',' + p.c;
        if (!byCell.has(k)) byCell.set(k, []);
        if (byCell.get(k).indexOf(i) === -1) byCell.get(k).push(i);
      });
    });
    const used = new Set();
    byCell.forEach(function (idxs, k) {
      if (idxs.length >= 2) {
        const parts = k.split(',');
        spawns.push({ r: +parts[0], c: +parts[1], type: runs[idxs[0]].type, special: 'bomb' });
        idxs.forEach(function (i) { used.add(i); });
      }
    });
    runs.forEach(function (run, i) {
      if (used.has(i) || run.len < 4) return;
      const p = anchorOf(run);
      spawns.push({ r: p.r, c: p.c, type: run.type, special: 'line' });
    });
    // 去重
    const seen = new Set();
    return spawns.filter(function (s) {
      const k = s.r + ',' + s.c;
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });
  }

  function applySpawn(sp) {
    if (!inBounds(sp.r, sp.c)) return;
    const cell = S.board[sp.r][sp.c];
    const t = S.grid[sp.r][sp.c];
    if (!cell || !t) return;
    cell.special = sp.special;
    cell.type = sp.type;
    applyLook(t);
    t.el.classList.remove('born');
    void t.el.offsetWidth;
    t.el.classList.add('born');
    setTimeout(function () { t.el.classList.remove('born'); }, 520);
  }

  async function clearStep(positions, combo, spawns) {
    const counts = [0, 0, 0, 0, 0];
    const list = [];
    let cx = 0, cy = 0;

    for (const p of positions) {
      const t = S.grid[p.r][p.c];
      if (!t) continue;
      list.push(t);
      counts[t.cell.type]++;
      cx += p.c + 0.5;
      cy += p.r + 0.5;
    }
    if (!list.length) return;
    cx /= list.length; cy /= list.length;

    // 数值结算
    let dmg = 0, healLife = 0, healSanity = 0;
    for (let i = 0; i < 5; i++) {
      const m = TYPE_META[i];
      dmg += counts[i] * m.dmg;
      healLife += counts[i] * m.life;
      healSanity += counts[i] * m.sanity;
    }
    if (S.buffs.spore) healLife += counts[4] * 2; // 孢子扩殖：青孢额外回生命
    const mult = S.buffs.blood ? 1.25 : 1; // 血祭增幅：得分 +25%
    const gain = Math.round(list.length * 10 * combo * mult);
    S.score += gain;
    S.boss.hp = Math.max(0, S.boss.hp - dmg);
    S.boss.phase = S.boss.hp <= S.boss.maxHp * 0.33 ? 3 : (S.boss.hp <= S.boss.maxHp * 0.66 ? 2 : 1);
    S.player.life = Math.min(S.player.maxLife, S.player.life + healLife);
    S.player.sanity = Math.min(S.player.maxSanity, S.player.sanity + healSanity);
    S.weapon.charge = Math.min(S.weapon.max, S.weapon.charge + list.length * 4);
    S.weapon.ready = S.weapon.charge >= S.weapon.max;

    // 视觉
    for (const t of list) {
      t.el.style.zIndex = 9;
      t.el.classList.add('pop');
      burst(t.c, t.r, TYPE_META[t.cell.type].glow, combo > 2 ? 1.3 : 1);
    }
    Sfx.pop(combo);
    if (combo >= 2) showCombo(combo);
    if (dmg > 0) { bossFlash(); scorePop(cx - 0.5, cy - 0.5, '-' + dmg, 'dmg'); }
    else scorePop(cx - 0.5, cy - 0.5, '+' + gain, 'gain');
    if (combo >= 3) shake(combo >= 4 ? 'hard' : 'soft');
    if (spawns && spawns.length) Sfx.special();

    updateHUD();
    await wait(235);

    // 移除
    for (const t of list) {
      if (S.board[t.r] && S.board[t.r][t.c] === t.cell) S.board[t.r][t.c] = null;
      if (S.grid[t.r] && S.grid[t.r][t.c] === t) S.grid[t.r][t.c] = null;
      S.tiles.delete(t.id);
      t.el.remove();
    }

    // 下落补位
    const ms = collapseBoard();
    await wait(ms);

    if (spawns) for (const sp of spawns) applySpawn(sp);
    updateHUD();
  }

  function collapseBoard() {
    const moves = [];
    const fresh = [];

    for (let c = 0; c < COLS; c++) {
      let write = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        const cell = S.board[r][c];
        if (!cell) continue;
        const t = S.tiles.get(cell.id);
        if (write !== r) {
          S.board[write][c] = cell;
          S.board[r][c] = null;
          S.grid[write][c] = t;
          S.grid[r][c] = null;
          if (t) {
            moves.push({ t: t, toR: write, toC: c, dist: write - r });
            t.r = write; t.c = c;
          }
        } else {
          S.grid[r][c] = t;
        }
        write--;
      }

      let above = 1;
      for (let r = write; r >= 0; r--) {
        const cell = B.makeCell(B.randType());
        S.board[r][c] = cell;
        const t = createTile(cell, r, c, -above);
        t.r = r; t.c = c;
        S.grid[r][c] = t;
        fresh.push(t);
        above++;
      }
    }

    let maxDur = 0;
    for (const m of moves) {
      const dur = 150 + m.dist * 42;
      maxDur = Math.max(maxDur, dur);
      setTransform(m.t, m.toR, m.toC, dur, EASE_FALL);
      setTimeout(squash.bind(null, m.t), dur);
    }
    for (const t of fresh) {
      void t.el.offsetWidth;
      const dur = 240 + t.r * 55;
      maxDur = Math.max(maxDur, dur);
      setTransform(t, t.r, t.c, dur, EASE_FALL);
      setTimeout(squash.bind(null, t), dur);
    }
    if (moves.length || fresh.length) {
      setTimeout(function () { Sfx.land(); }, Math.min(200, maxDur * 0.5));
    }
    return Math.max(260, maxDur + 90);
  }

  async function resolveCascades() {
    let combo = 0;
    let runs = B.findRuns(S.board);
    while (runs.length && !S.over) {
      combo++;
      S.combo = combo;
      const spawns = collectSpawns(runs);
      const positions = collectClear(runs);
      await clearStep(positions, combo, spawns);
      await wait(40);
      runs = B.findRuns(S.board);
    }
    S.maxCombo = Math.max(S.maxCombo, combo);
    S.combo = 0;
    await ensurePlayable();
    return combo;
  }

  async function ensurePlayable(force) {
    if (!force && B.hasPossibleMove(S.board)) return;
    B.shuffleBoard(S.board);
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = S.grid[r][c];
        if (!t) continue;
        t.cell = S.board[r][c];
        t.cell.special = null;
        applyLook(t);
        t.el.classList.remove('born');
        void t.el.offsetWidth;
        t.el.classList.add('born');
      }
    }
    // 重新绑定 cell 引用
    S.tiles.forEach(function (t) { t.cell = S.board[t.r][t.c]; });
    Sfx.special();
    await wait(420);
  }

  /* ============================== 回合 ============================== */
  async function finishTurn() {
    if (S.over) return;
    S.turn++;
    S.boss.attackIn--;
    if (S.boss.attackIn <= 0) {
      S.boss.attackIn = 3;
      S.player.life = Math.max(0, S.player.life - BOSS_ATTACK_LIFE);
      S.player.sanity = Math.max(0, S.player.sanity - BOSS_ATTACK_SANITY);
      Sfx.boss();
      shake('hard');
      scorePop(3.5, 6, '深渊凝视！', 'danger');
      updateHUD();
      await wait(320);
    }
    updateHUD();
    checkEnd();
  }

  function checkEnd() {
    if (S.over) return;
    if (S.boss.hp <= 0) endBattle(true);
    else if (S.player.life <= 0 || S.player.sanity <= 0) endBattle(false);
  }

  function endBattle(win) {
    if (S.over) return;
    S.over = true;
    if (win) Sfx.win(); else Sfx.lose();
    setTimeout(function () { showSettlement(win); }, 420);
  }

  /* ============================== 手势 ============================== */
  let drag = null;
  let selected = null;

  function cellSize() { return el.board.clientWidth / COLS; }

  function clearSelection() {
    if (selected) {
      selected.el.classList.remove('sel');
      selected = null;
    }
  }

  function clearTargetMark() {
    if (S.targetMark) {
      const tm = S.targetMark;
      S.targetMark = null;
      tm.el.classList.remove('target');
      setTransform(tm, tm.r, tm.c, 150, EASE_BACK);
    }
  }

  function tileFromEvent(e) {
    const node = e.target.closest('.tile');
    if (!node) return null;
    return S.tiles.get(Number(node.dataset.id)) || null;
  }

  function dirOf(dx, dy, cell) {
    if (Math.abs(dx) < cell * 0.12 && Math.abs(dy) < cell * 0.12) return null;
    if (Math.abs(dx) >= Math.abs(dy)) return dx > 0 ? 'right' : 'left';
    return dy > 0 ? 'down' : 'up';
  }

  function neighborOf(t, dir) {
    const d = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] }[dir];
    if (!d) return null;
    const r = t.r + d[0], c = t.c + d[1];
    if (!inBounds(r, c)) return null;
    return S.grid[r][c];
  }

  function onDown(e) {
    if (S.busy || S.paused || S.over || e.button === 2) return;
    if (S.aim) { handleAimDown(e); return; }
    const t = tileFromEvent(e);
    if (!t) return;
    Sfx.unlock();
    drag = {
      t: t,
      sx: e.clientX,
      sy: e.clientY,
      cell: cellSize(),
      moved: false,
      dir: null,
      pid: e.pointerId,
    };
    t.el.classList.add('dragging');
    try { el.board.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
    e.preventDefault();
  }

  function onMove(e) {
    if (!drag || drag.pid !== e.pointerId) return;
    const dx = e.clientX - drag.sx;
    const dy = e.clientY - drag.sy;
    const cell = drag.cell;
    const max = cell * 0.92;
    const ox = Math.max(-max, Math.min(max, dx));
    const oy = Math.max(-max, Math.min(max, dy));
    drag.moved = drag.moved || Math.abs(dx) > 6 || Math.abs(dy) > 6;

    const t = drag.t;
    t.el.style.transition = 'none';
    t.el.style.transform = 'translate3d(calc(' + (t.c * 100) + '% + ' + ox + 'px),calc(' + (t.r * 100) + '% + ' + oy + 'px),0)';

    const dir = dirOf(dx, dy, cell);
    drag.dir = dir;
    clearTargetMark();
    if (dir) {
      const nb = neighborOf(t, dir);
      if (nb) {
        S.targetMark = nb;
        nb.el.classList.add('target');
        // 邻格反向预位移：手指拖多少，它就让开多少（交换预览）
        nb.el.style.transition = 'none';
        const px = -ox * 0.34;
        const py = -oy * 0.34;
        nb.el.style.transform = 'translate3d(calc(' + (nb.c * 100) + '% + ' + px + 'px),calc(' + (nb.r * 100) + '% + ' + py + 'px),0)';
      }
    }
    e.preventDefault();
  }

  function onUp(e) {
    if (!drag || drag.pid !== e.pointerId) return;
    const t = drag.t;
    const dx = e.clientX - drag.sx;
    const dy = e.clientY - drag.sy;
    const moved = drag.moved;
    const dir = drag.dir;
    const cell = drag.cell;
    drag = null;

    t.el.classList.remove('dragging');
    clearTargetMark();

    if (!moved) {
      // 轻点：选中 / 交换（点选兜底，和滑动一样可用）
      if (!selected) {
        selected = t;
        t.el.classList.add('sel');
        Sfx.swap();
      } else if (selected === t) {
        clearSelection();
      } else {
        const a = selected;
        if (B.isAdjacent(a.r, a.c, t.r, t.c)) {
          clearSelection();
          attemptSwap(a, t);
        } else {
          clearSelection();
          selected = t;
          t.el.classList.add('sel');
        }
      }
      return;
    }

    const dist = Math.max(Math.abs(dx), Math.abs(dy));
    if (dist > cell * 0.28 && dir) {
      const nb = neighborOf(t, dir);
      if (nb) { attemptSwap(t, nb); return; }
    }
    // 回弹
    setTransform(t, t.r, t.c, 220, EASE_BACK);
    setTimeout(function () { squash(t); }, 200);
  }

  function onCancel() {
    if (!drag) return;
    const t = drag.t;
    drag = null;
    t.el.classList.remove('dragging');
    clearTargetMark();
    setTransform(t, t.r, t.c, 180, EASE_BACK);
  }

  /* ============================== 按钮 ============================== */
  function openPause() {
    if (S.over) return;
    S.paused = true;
    el.overlay.hidden = false;
  }
  function resume() {
    S.paused = false;
    el.overlay.hidden = true;
  }

  async function unleashWeapon() {
    if (S.busy || S.paused || S.over || !S.weapon.ready) return;
    S.busy = true;
    S.weapon.charge = 0;
    S.weapon.ready = false;
    updateHUD();
    Sfx.boss();
    shake('hard');
    S.boss.hp = Math.max(0, S.boss.hp - WEAPON_DMG);
    S.boss.phase = S.boss.hp <= S.boss.maxHp * 0.33 ? 3 : (S.boss.hp <= S.boss.maxHp * 0.66 ? 2 : 1);
    bossFlash();
    scorePop(3.5, 5, '生物武器 -' + WEAPON_DMG, 'dmg');
    for (let i = 0; i < 3; i++) {
      burst(Math.random() * COLS, Math.random() * 6, '#B98BE0', 1.6);
    }
    updateHUD();
    await wait(520);
    S.busy = false;
    checkEnd();
  }

  /* ============================== 祭坛 ============================== */
  let shopCat = 'all';

  function refreshAltarBalance() {
    const st = Shop.load();
    const node = document.getElementById('altar-essence');
    if (node) node.textContent = '◈ ' + st.crystals;
  }

  function showShop() {
    const st = Shop.load();
    const dailyDone = st.daily === Shop.today();

    let tabs = '';
    Shop.CATS.forEach(function (c) {
      tabs += '<div class="shop-tab ' + (shopCat === c.id ? 'active' : '') + '" data-cat="' + c.id + '">' + c.name + '</div>';
    });

    let items = '';
    Shop.ITEMS.forEach(function (it) {
      if (shopCat !== 'all' && it.cat !== shopCat) return;
      const owned = Shop.countOf(st, it.id);
      const afford = st.crystals >= it.price;
      items += '<div class="shop-item">' +
        '<div class="shop-icon" style="border-color:' + it.tint + '"><span class="shop-emoji">' + it.icon + '</span>' +
          (owned > 0 ? '<span class="own-badge">×' + owned + '</span>' : '') + '</div>' +
        '<div class="shop-info"><div class="shop-name">' + it.name + '<span class="shop-en">' + it.en + '</span></div>' +
        '<div class="shop-desc">' + it.desc + '</div></div>' +
        '<div class="buy-btn ' + (afford ? '' : 'poor') + '" data-buy="' + it.id + '">◈ ' + it.price + '</div>' +
        '</div>';
    });

    screenShop.innerHTML =
      '<div class="shop-inner">' +
        '<div class="shop-head"><div class="shop-title">亵渎祭坛</div><div class="shop-en-title">PROFANE ALTAR</div></div>' +
        '<div class="essence-bar"><div class="essence-icon">◈</div><div class="essence-label">深渊精华</div><div class="essence-val">' + st.crystals + '</div></div>' +
        '<div class="daily-card ' + (dailyDone ? 'done' : '') + '" data-daily="1">' +
          '<div class="daily-icon">🕯</div>' +
          '<div class="daily-text"><div class="daily-title">每日祭品<span class="daily-en">DAILY</span></div>' +
          '<div class="daily-desc">深渊精华 ×8 · 窥视之瞳 ×1</div></div>' +
          '<div class="daily-btn">' + (dailyDone ? '已领取' : '领取') + '</div>' +
        '</div>' +
        '<div class="shop-tabs">' + tabs + '</div>' +
        '<div class="shop-list">' + items + '</div>' +
        '<button class="leave-btn" data-act="leave">离开祭坛</button>' +
        '<div class="shop-foot">消耗品收入背包，开局可在战斗页取用；本局强化下一场潜入生效</div>' +
      '</div>';
    showScreen('shop');
  }

  function buyProduct(id) {
    const item = Shop.BY_ID[id];
    if (!item) return;
    const r = Shop.buy(id);
    if (!r.ok) { Sfx.invalid(); return; }
    Sfx.special();
    showShop();
    refreshAltarBalance();
  }

  function claimDaily() {
    const r = Shop.claimDaily();
    if (!r.ok) { Sfx.invalid(); return; }
    Sfx.win();
    showShop();
    refreshAltarBalance();
  }

  /* ============================== 战斗道具 ============================== */
  function refreshItems() {
    if (!el.itemsLayer) return;
    const st = Shop.load();
    const bar = Shop.ITEMS.filter(function (it) {
      return (it.cat === 'tool' || it.cat === 'supply') && (st.inv[it.id] || 0) > 0;
    });
    if (!bar.length) {
      el.itemsLayer.hidden = true;
      el.itemsLayer.innerHTML = '';
      S.itemBar = [];
      return;
    }
    el.itemsLayer.hidden = false;
    el.itemsLayer.innerHTML = bar.map(function (it) {
      return '<button class="item-chip" data-item="' + it.id + '" title="' + it.name + '">' +
        '<span class="item-ico">' + it.icon + '</span>' +
        '<span class="item-count">' + st.inv[it.id] + '</span></button>';
    }).join('');
    S.itemBar = bar.map(function (it) { return it.id; });
  }

  function announceBuffs() {
    const names = [];
    if (S.buffs.blood) names.push('血祭增幅');
    if (S.buffs.spore) names.push('孢子扩殖');
    if (S.buffs.tendril) names.push('触须延展');
    if (!names.length) return;
    setTimeout(function () { scorePop(4, 2, '本局强化 · ' + names.join(' / '), 'gain'); }, 600);
  }

  function useItem(id) {
    if (S.busy || S.paused || S.over) return;
    const item = Shop.BY_ID[id];
    if (!item) return;
    const st = Shop.load();
    if (!(st.inv[id] > 0)) return;

    if (item.target) {
      S.aim = { id: id, type: item.target };
      S.aimFirst = null;
      el.aimBar.hidden = false;
      el.aimText.textContent = item.target === 'swap' ? '依次点击两颗宝石置换' : ('点击棋盘使用「' + item.name + '」');
      Sfx.swap();
      return;
    }
    applyInstant(id);
  }

  function cancelAim() {
    if (S.aimFirst && S.aimFirst.el) S.aimFirst.el.classList.remove('sel');
    S.aimFirst = null;
    S.aim = null;
    if (el.aimBar) el.aimBar.hidden = true;
  }

  function handleAimDown(e) {
    const t = tileFromEvent(e);
    if (!t || !S.aim) return;
    const aim = S.aim;

    if (aim.type === 'swap') {
      if (!S.aimFirst) {
        S.aimFirst = t;
        t.el.classList.add('sel');
        return;
      }
      if (S.aimFirst === t) { cancelAim(); return; }
      const a = S.aimFirst;
      a.el.classList.remove('sel');
      S.aimFirst = null;
      Shop.consume('swap');
      cancelAim();
      refreshItems();
      doToolSwap(a, t);
      return;
    }

    Shop.consume(aim.id);
    const id = aim.id;
    const type = aim.type;
    cancelAim();
    refreshItems();
    doToolAt(id, type, t);
  }

  function applyInstant(id) {
    if (id === 'life' && S.player.life >= S.player.maxLife) return;
    if (id === 'sanity' && S.player.sanity >= S.player.maxSanity) return;
    if (!Shop.consume(id)) return;

    if (id === 'life') {
      S.player.life = Math.min(S.player.maxLife, S.player.life + 30);
      scorePop(4, 3, '生命 +30', 'gain');
    } else if (id === 'sanity') {
      S.player.sanity = Math.min(S.player.maxSanity, S.player.sanity + 30);
      scorePop(4, 3, '理智 +30', 'gain');
    } else if (id === 'core') {
      S.weapon.charge = Math.min(S.weapon.max, S.weapon.charge + 50);
      S.weapon.ready = S.weapon.charge >= S.weapon.max;
      scorePop(4, 3, '武器充能 +50%', 'gain');
    } else if (id === 'stasis') {
      S.boss.attackIn += 2;
      scorePop(4, 3, '深渊凝视延后 2 回合', 'gain');
    } else if (id === 'shuffle') {
      doShuffleTool();
      return;
    } else if (id === 'hint') {
      doHint();
      return;
    }

    Sfx.special();
    updateHUD();
    refreshItems();
  }

  async function doToolAt(id, type, tile) {
    S.busy = true;
    const positions = [];
    if (type === 'single') {
      positions.push({ r: tile.r, c: tile.c });
    } else if (type === 'area') {
      const rad = S.buffs.tendril ? 2 : 1;
      for (let dr = -rad; dr <= rad; dr++)
        for (let dc = -rad; dc <= rad; dc++)
          if (inBounds(tile.r + dr, tile.c + dc)) positions.push({ r: tile.r + dr, c: tile.c + dc });
    } else if (type === 'color') {
      const want = tile.cell.type;
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++) {
          const cell = S.board[r][c];
          if (cell && cell.type === want) positions.push({ r: r, c: c });
        }
    }

    Sfx.special();
    shake('soft');
    await clearStep(positions, 1, []);
    await resolveCascades();
    S.busy = false;
    refreshItems();
  }

  async function doToolSwap(a, b) {
    S.busy = true;
    await animateSwap(a, b);
    if (B.findRuns(S.board).length > 0) {
      await resolveCascades();
    } else {
      scorePop(a.c, a.r, '置换完成', 'gain');
    }
    S.busy = false;
    refreshItems();
  }

  async function doShuffleTool() {
    S.busy = true;
    await ensurePlayable(true);
    S.busy = false;
    refreshItems();
  }

  function doHint() {
    const swap = findHintMove();
    if (!swap) return;
    const a = S.grid[swap.a[0]][swap.a[1]];
    const b = S.grid[swap.b[0]][swap.b[1]];
    if (!a || !b) return;
    a.el.classList.add('hint');
    b.el.classList.add('hint');
    Sfx.swap();
    setTimeout(function () {
      a.el.classList.remove('hint');
      b.el.classList.remove('hint');
    }, 3000);
  }

  function findHintMove() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (c + 1 < COLS) {
          B.swapCells(S.board, r, c, r, c + 1);
          const ok1 = B.findRuns(S.board).length > 0;
          B.swapCells(S.board, r, c, r, c + 1);
          if (ok1) return { a: [r, c], b: [r, c + 1] };
        }
        if (r + 1 < ROWS) {
          B.swapCells(S.board, r, c, r + 1, c);
          const ok2 = B.findRuns(S.board).length > 0;
          B.swapCells(S.board, r, c, r + 1, c);
          if (ok2) return { a: [r, c], b: [r + 1, c] };
        }
      }
    }
    return null;
  }

  /* ============================== 结算 ============================== */
  function showSettlement(win) {
    const turns = S.turn;
    const combo = S.maxCombo;
    const life = Math.round(S.player.life);
    const abandon = !win && S.abandoned;
    const gene = win ? (20 + turns) : 0;
    let grade = 'C';
    if (win) grade = turns <= 12 ? 'S' : (turns <= 20 ? 'A' : 'B');

    const loots = win ? [
      { name: '深渊之喉核心', desc: '生物武器 · 主武器升级素材', tag: '传说', cls: 'legend' },
      { name: '寄生孢子样本 ×3', desc: 'Buff 道具 · 提升腐蚀伤害', tag: '史诗', cls: 'epic' },
      { name: '深渊精华', desc: '祭坛供奉货币 · 兑换道具', tag: '精良', cls: 'fine' },
    ] : [];

    const essenceGain = win ? Math.min(40, 10 + Math.floor(S.score / 40)) : 3;
    Shop.gainCrystals(essenceGain);

    let html = '<div class="result-block">' +
      '<div class="result-icon"><span class="result-glyph">' + (win ? '✶' : '☠') + '</span></div>' +
      '<div class="result-title">' + (win ? '潜入成功' : (abandon ? '已放弃潜入' : '潜入失败')) + '</div>' +
      '<div class="result-en">' + (win ? 'VICTORY' : 'DEFEATED') + '</div>' +
      '<div class="result-desc">' + (win ? BOSS_NAME + ' 已被击溃'
        : (abandon ? '你撤离了第 ' + S.layer + ' 层' : '你倒在了第 ' + S.layer + ' 层的深渊中')) + '</div></div>';

    html += '<div class="score-row">' +
      '<div class="grade-card"><span class="grade-label">评级</span>' +
        '<span class="grade-val">' + grade + '</span>' +
        '<span class="grade-stars">' + (win ? '★★★★★' : '☆☆☆☆☆') + '</span></div>' +
      '<div class="stats-stack">' +
        '<div class="stat-line"><span class="sl">抵达层数</span><span class="sv">第 ' + S.layer + ' 层</span></div>' +
        '<div class="stat-line"><span class="sl">潜入回合</span><span class="sv">' + turns + '</span></div>' +
        '<div class="stat-line"><span class="sl">最高连击</span><span class="sv">' + combo + ' 连击</span></div>' +
        '<div class="stat-line"><span class="sl">消除得分</span><span class="sv">' + S.score + '</span></div>' +
      '</div></div>';

    html += '<div class="essence-row"><span class="essence-row-label">深渊精华回收</span>' +
      '<span class="essence-row-val">◈ +' + essenceGain + '</span></div>';

    if (win) {
      html += '<div class="gene-card"><div class="gene-icon">⚜</div>' +
        '<div class="gene-text"><span class="gene-t">基因样本回收</span>' +
        '<span class="gene-d">用于生物武器强化与基因图鉴解锁</span></div>' +
        '<span class="gene-val">+' + gene + '</span></div>';
      html += '<div class="loot-section"><span class="loot-title">战利品 · LOOT</span>';
      for (const it of loots) {
        html += '<div class="loot-card ' + it.cls + '"><div class="loot-icon">◈</div>' +
          '<div class="loot-text"><span class="loot-name">' + it.name + '</span>' +
          '<span class="loot-desc">' + it.desc + '</span></div>' +
          '<span class="loot-tag">' + it.tag + '</span></div>';
      }
      html += '</div>';
    }

    html += '<div class="bottom-btns">' +
      '<button class="btn-primary" data-act="retry">' + (win ? '继续潜入 · 下一层' : '重新挑战本层') + '</button>' +
      (win ? '<button class="btn-ghost" data-act="shop">前往亵渎祭坛</button>' : '') +
      '<button class="btn-ghost" data-act="home">返回深渊</button></div>';

    screenSettle.className = 'screen settle ' + (win ? 'win' : 'lose');
    screenSettle.innerHTML = html;
    showScreen('settle');

    screenSettle.onclick = function (e) {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const act = btn.getAttribute('data-act');
      if (act === 'retry') newBattle(win ? S.layer + 1 : S.layer);
      else if (act === 'shop') showShop();
      else showScreen('title');
    };
  }

  /* ============================== 启动 ============================== */
  function showScreen(name) {
    document.getElementById('screen-title').classList.toggle('active', name === 'title');
    screenBattle.classList.toggle('active', name === 'battle');
    screenSettle.classList.toggle('active', name === 'settle');
    screenShop.classList.toggle('active', name === 'shop');
  }

  buildShell();

  refreshAltarBalance();

  document.getElementById('enter-btn').addEventListener('click', function () {
    Sfx.unlock();
    newBattle(7);
  });

  document.getElementById('altar-btn').addEventListener('click', function () {
    Sfx.unlock();
    showShop();
  });

  screenShop.addEventListener('click', function (e) {
    const catEl = e.target.closest('[data-cat]');
    if (catEl) { shopCat = catEl.getAttribute('data-cat'); showShop(); return; }
    const buyEl = e.target.closest('[data-buy]');
    if (buyEl) { buyProduct(buyEl.getAttribute('data-buy')); return; }
    if (e.target.closest('[data-daily]')) { claimDaily(); return; }
    if (e.target.closest('[data-act="leave"]')) { showScreen('title'); refreshAltarBalance(); }
  });

  el.board.addEventListener('pointerdown', onDown);
  el.board.addEventListener('pointermove', onMove);
  el.board.addEventListener('pointerup', onUp);
  el.board.addEventListener('pointercancel', onCancel);
  el.board.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  window.addEventListener('resize', fitBoard);
  window.addEventListener('orientationchange', function () { setTimeout(fitBoard, 120); });
  if (window.ResizeObserver) {
    new ResizeObserver(fitBoard).observe(el.boardWrap);
  }

  screenBattle.addEventListener('click', function (e) {
    const itemBtn = e.target.closest('[data-item]');
    if (itemBtn) { useItem(itemBtn.getAttribute('data-item')); return; }
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const a = btn.getAttribute('data-action');
    if (a === 'pause') openPause();
    else if (a === 'resume') resume();
    else if (a === 'restart') { resume(); newBattle(S.layer); }
    else if (a === 'abandon') { resume(); S.over = true; S.abandoned = true; showSettlement(false); }
    else if (a === 'weapon') unleashWeapon();
    else if (a === 'cancel-aim') cancelAim();
  });

  // 调试 / 自动化测试钩子
  window.__ABYSS__ = {
    S: S, B: B,
    attemptSwap: attemptSwap,
    newBattle: newBattle,
    tileAt: function (r, c) { return S.grid[r][c]; },
    snapshot: function () {
      return S.board.map(function (row) { return row.map(function (c) { return c ? c.type : -1; }); });
    },
  };
})();

</script>
